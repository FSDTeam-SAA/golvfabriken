# Staging stack — golvfabriken (separate Postgres, separate Redis, separate volumes).
# Shares the `web` external network with the prod stack so the same Caddy routes both.
#
# Required env file: .env.staging
#
# LOCAL-DEV NOTE: ports: blocks were added below (9000/1337/8000) so services are
# reachable at localhost from a browser when running this outside the VPS/Caddy.

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-strapi-db.sh:/docker-entrypoint-initdb.d/10-init-strapi-db.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-staging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  medusa-backend-staging:
    image: ${MEDUSA_IMAGE:?MEDUSA_IMAGE is required}
    container_name: medusa-backend-staging
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      MEDUSA_WORKER_MODE: server
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET}
      MEDUSA_ADMIN_BACKEND_URL: ${MEDUSA_BACKEND_URL}
    ports:
      - "9000:9000"
    networks:
      - internal
      - web

  medusa-worker-staging:
    image: ${MEDUSA_IMAGE:?MEDUSA_IMAGE is required}
    container_name: medusa-worker-staging
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      MEDUSA_WORKER_MODE: worker
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET}
    networks:
      - internal

  strapi-staging:
    image: ${STRAPI_IMAGE:?STRAPI_IMAGE is required}
    container_name: strapi-staging
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${STRAPI_USER_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: golvfabriken_cms
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    ports:
      - "1337:1337"
    networks:
      - internal
      - web

  storefront-staging:
    image: ${STOREFRONT_IMAGE:?STOREFRONT_IMAGE is required}
    container_name: storefront-staging
    restart: unless-stopped
    depends_on:
      medusa-backend-staging: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      VITE_MEDUSA_BACKEND_URL: ${VITE_MEDUSA_BACKEND_URL}
      VITE_MEDUSA_PUBLISHABLE_KEY: ${VITE_MEDUSA_PUBLISHABLE_KEY}
      MEDUSA_BACKEND_URL_INTERNAL: http://medusa-backend-staging:9000
    ports:
      - "8000:8000"
    networks:
      - web
      - internal

networks:
  internal:
    name: golvfabriken-staging-internal
    driver: bridge
  web:
    external: true

volumes:
  postgres_data:
    name: golvfabriken_staging_postgres_data
  redis_data:
    name: golvfabriken_staging_redis_data