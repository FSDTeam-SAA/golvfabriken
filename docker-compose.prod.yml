# Production stack — golvfabriken.
# DB + Redis are internal-only. Public traffic enters via the shared `web` Caddy.
#
# Required env file: .env.prod (see deploy/env.prod.example)
# Images are pulled from GHCR (built + pushed by GitHub Actions).

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-strapi-db.sh:/docker-entrypoint-initdb.d/10-init-strapi-db.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  medusa-backend:
    image: ${MEDUSA_IMAGE:?MEDUSA_IMAGE is required}
    container_name: medusa-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      MEDUSA_WORKER_MODE: server
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET}
      MEDUSA_ADMIN_BACKEND_URL: ${MEDUSA_BACKEND_URL}
    networks:
      - internal
      - web

  medusa-worker:
    image: ${MEDUSA_IMAGE:?MEDUSA_IMAGE is required}
    container_name: medusa-worker
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      NODE_ENV: production
      MEDUSA_WORKER_MODE: worker
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET}
    networks:
      - internal

  strapi:
    image: ${STRAPI_IMAGE:?STRAPI_IMAGE is required}
    container_name: strapi
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${STRAPI_USER_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: golvfabriken_cms
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      # R2 (S3-compatible) upload provider
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    networks:
      - internal
      - web

  storefront:
    image: ${STOREFRONT_IMAGE:?STOREFRONT_IMAGE is required}
    container_name: storefront
    restart: unless-stopped
    depends_on:
      medusa-backend: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      VITE_MEDUSA_BACKEND_URL: ${VITE_MEDUSA_BACKEND_URL}
      VITE_MEDUSA_PUBLISHABLE_KEY: ${VITE_MEDUSA_PUBLISHABLE_KEY}
      MEDUSA_BACKEND_URL_INTERNAL: http://medusa-backend:9000
    networks:
      - web
      - internal

networks:
  internal:
    name: golvfabriken-prod-internal
    driver: bridge
  web:
    external: true

volumes:
  postgres_data:
    name: golvfabriken_prod_postgres_data
  redis_data:
    name: golvfabriken_prod_redis_data
